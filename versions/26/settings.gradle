pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 26.x needs Java 25 to compile against. Rather than ask for a system JDK, let gradle
// fetch one into ~/.gradle/jdks and use it for this build only.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'customblocksounds'
