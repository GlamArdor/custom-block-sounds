org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# From 26.1 Minecraft ships without obfuscation: there are no yarn or intermediary mappings
# for this line, the game is compiled against Mojang's own names, and it needs Java 25. That
# is why this range cannot share a jar with the 1.21 build in the repository root.
minecraft_version=26.2
loader_version=0.20.0
loom_version=1.17.17

minecraft_range=>=26.2 <=26.3

mod_version=1.0.1
maven_group=com.reign
archives_base_name=customblocksounds

fabric_api_version=0.161.0+26.2
